{% load static %}
<header class="header">
    <div class="container">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon"></span>
                <span class="logo-text">OLD SCHOOL</span>
            </div>
            <nav class="nav">
                <a href="#" class="nav-link">Tổng quan</a>
                <a href="{% url 'cart:products' %}" class="nav-link">Sản phẩm</a>
                <a href="{% url 'cart:orders' %}" class="nav-link">Đơn hàng</a>
                <a href="#" class="nav-link">Bộ sưu tập</a>
                <a href="#" class="nav-link">Tết sale</a>
            </nav>
            <div class="header-actions">
                <input type="text" class="search-input" placeholder="Tìm kiếm nhanh...">
                
                <!-- User Avatar -->
                <button class="user-avatar-btn">
                    <img src="{% static 'cart/images/avatar.svg' %}" alt="User" class="user-avatar-img">
                </button>
                
                <!-- Cart Icon with Badge -->
                <button class="cart-icon-btn" onclick="window.location.href='{% url 'cart:cart' %}'">
                    <svg class="cart-icon-svg" viewBox="0 0 64 64" fill="none">
                        <path d="M8 12h6l6 32h28l6-24H18" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="24" cy="52" r="3" fill="currentColor"/>
                        <circle cx="44" cy="52" r="3" fill="currentColor"/>
                    </svg>
                    <span class="cart-badge-large" id="cartBadge">7</span>
                </button>
            </div>
        </div>
    </div>
</header>
