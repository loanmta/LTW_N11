{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Kiểm tra Email - Old School</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'accounts/style.css' %}">
</head>
<body>
    <div class="login-wrapper">
        <div class="left-panel">
            <div class="branding-content">
                <div class="logo-circle">OS</div>
                <h1 class="brand-title">Old School</h1>
                <h2 class="brand-subtitle">Fashion Style</h2>
                <p class="brand-desc">Phong cách thời trang cổ điển, thanh lịch và sang trọng</p>
            </div>
        </div>

        <div class="right-panel">
            <div class="form-container" style="text-align: center;">
                <h1 class="main-title" style="font-size: 32px;">KIỂM TRA EMAIL</h1>

                <div style="margin: 30px 0;">
                    <span style="font-size: 60px;">📧</span>
                </div>

                <p style="font-size: 15px; color: #333; line-height: 1.6;">
                    Chúng tôi đã gửi một email chứa liên kết để bạn đặt lại mật khẩu. <br>
                    <b>Vui lòng kiểm tra hộp thư đến (và cả mục Spam).</b>
                </p>

                <hr class="divider">
                <p class="register-text">
                    <a href="{% url 'login' %}" class="register-link">← Quay lại Đăng nhập</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
