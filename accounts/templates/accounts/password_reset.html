{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quên mật khẩu - Old School</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'accounts/style.css' %}">
</head>
<body>
    <div class="login-wrapper">
        <div class="left-panel">
            <div class="branding-content">
                <div class="logo-circle">OS</div>
                <h1 class="brand-title">Old School</h1>
                <h2 class="brand-subtitle">Fashion Style</h2>
                <p class="brand-desc">Phong cách thời trang cổ điển, thanh lịch và sang trọng</p>
            </div>
        </div>

        <div class="right-panel">
            <div class="form-container">
                <h1 class="main-title" style="font-size: 32px;">QUÊN MẬT KHẨU</h1>
                <p class="subtitle">Nhập email để nhận link khôi phục tài khoản</p>

                <form method="POST">
                    {% csrf_token %}
                    {{ form.email.errors }}
                    <div class="input-group">
                        <label>Email của bạn</label>
                        <input type="email" name="email" placeholder="Nhập email đã đăng ký..." required>
                    </div>

                    <button type="submit" class="btn-login">Gửi link khôi phục</button>
                </form>

                <hr class="divider">
                <p class="register-text">
                    Đã nhớ ra mật khẩu? <a href="{% url 'login' %}" class="register-link">Đăng nhập</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
