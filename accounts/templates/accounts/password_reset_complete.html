{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đổi thành công - Old School</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'accounts/style.css' %}">
</head>
<body>
    <div class="login-wrapper">
        <div class="left-panel">
            <div class="branding-content">
                <div class="logo-circle">OS</div>
                <h1 class="brand-title">Old School</h1>
                <h2 class="brand-subtitle">Fashion Style</h2>
                <p class="brand-desc">Phong cách thời trang cổ điển, thanh lịch và sang trọng</p>
            </div>
        </div>

        <div class="right-panel">
            <div class="form-container" style="text-align: center;">
                <h1 class="main-title" style="font-size: 32px;">THÀNH CÔNG!</h1>

                <div style="margin: 30px 0;">
                    <span style="font-size: 60px;">🎉</span>
                </div>

                <p style="font-size: 15px; color: #333; line-height: 1.6;">
                    Mật khẩu của bạn đã được thay đổi thành công.<br>
                    Bây giờ bạn có thể đăng nhập bằng mật khẩu mới.
                </p>

                <hr class="divider">
                <a href="{% url 'login' %}" class="btn-login" style="display: inline-block; text-decoration: none; width: 100%;">Đăng nhập ngay</a>
            </div>
        </div>
    </div>
</body>
</html>
