<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo - OLD SCHOOL Admin</title>
    <link rel="stylesheet" href="/admin/assets/css/admin.css">
    <link rel="stylesheet" href="/admin/assets/css/reports.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="admin-body">
    <!-- Top Header -->
    <header class="admin-header">
        <div class="header-container">
            <div class="header-left">
                <div class="logo">
                    <span class="logo-icon"></span>
                    <span class="logo-text">OLD SCHOOL</span>
                </div>
            </div>
            
            <nav class="header-nav">
                <a href="/admin/pages/dashboard.html" class="nav-link">Tổng quan</a>
                <a href="/admin/pages/products.html" class="nav-link">Sản phẩm</a>
                <a href="/admin/pages/orders.html" class="nav-link">Đơn hàng</a>
                <a href="/admin/pages/reports.html" class="nav-link active">Báo cáo</a>
                <a href="/admin/pages/customers.html" class="nav-link">Khách hàng</a>
            </nav>
            
            <div class="header-right">
                <div class="search-box">
                    <input type="text" placeholder="Tìm kiếm nhanh...">
                </div>
                <div class="admin-user" onclick="handleAdminUserClick()">
                    <img src="/user/assets/images/avatar.svg" alt="Admin">
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="admin-content">
        <div class="content-container">
            <!-- Page Header -->
            <div class="page-header">
                <div class="page-header-left">
                    <h1 class="page-title">Báo cáo</h1>
                </div>
                <div class="page-header-right">
                    <button class="btn-export" onclick="exportPDF()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                        </svg>
                        Xuất file Excel
                    </button>
                </div>
            </div>

            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card red">
                    <div class="stat-label">TỔNG DOANH THU</div>
                    <div class="stat-value" id="totalRevenue">1.5 TỶ VNĐ</div>
                </div>
                <div class="stat-card green">
                    <div class="stat-label">SỐ ĐƠN HÀNG</div>
                    <div class="stat-value" id="totalOrders">12.000</div>
                </div>
                <div class="stat-card yellow">
                    <div class="stat-label">SẢN PHẨM</div>
                    <div class="stat-value" id="totalProducts">128</div>
                </div>
                <div class="stat-card orange">
                    <div class="stat-label">KHÁCH HÀNG</div>
                    <div class="stat-value" id="totalCustomers">100</div>
                </div>
            </div>

            <!-- Charts Grid -->
            <div class="charts-grid">
                <!-- Revenue Chart -->
                <div class="chart-card">
                    <div class="chart-header">
                        <h2>DOANH THU THEO THÁNG</h2>
                        <select class="chart-filter" id="revenueFilter" onchange="updateRevenueChart()">
                            <option value="month">Thời gian: Tháng</option>
                            <option value="quarter">Thời gian: Quý</option>
                            <option value="year">Thời gian: Năm</option>
                        </select>
                    </div>
                    <div class="chart-container">
                        <canvas id="revenueChart"></canvas>
                    </div>
                </div>

                <!-- Product Chart -->
                <div class="chart-card">
                    <div class="chart-header">
                        <h2>TỔNG DOANH THU THEO SẢN PHẨM</h2>
                    </div>
                    <div class="chart-container pie-chart">
                        <canvas id="productChart"></canvas>
                        <div class="chart-legend">
                            <div class="legend-item">
                                <span class="legend-color red"></span>
                                <span class="legend-label">: áo Hoodie</span>
                            </div>
                            <div class="legend-item">
                                <span class="legend-color gray"></span>
                                <span class="legend-label">: áo Tee</span>
                            </div>
                            <div class="legend-item">
                                <span class="legend-color blue"></span>
                                <span class="legend-label">: áo Sweater</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="admin-footer">
        <div class="footer-container">
            <div class="footer-left">
                <p>&copy; 2026 OLD SCHOOL. All rights reserved.</p>
            </div>
            <div class="footer-right">
                <a href="#">Điều khoản</a>
                <a href="#">Chính sách</a>
                <a href="#">Hỗ trợ</a>
            </div>
        </div>
    </footer>

    <script src="/admin/assets/js/admin-api.js"></script>
    <script src="/admin/assets/js/reports.js"></script>
    <script>
        function handleAdminUserClick() {
            const userName = sessionStorage.getItem('userName') || sessionStorage.getItem('userEmail') || 'Admin';
            const userEmail = sessionStorage.getItem('userEmail') || '';
            
            const existingMenu = document.querySelector('.admin-user-dropdown');
            if (existingMenu) {
                existingMenu.remove();
                return;
            }
            
            const menu = document.createElement('div');
            menu.className = 'admin-user-dropdown';
            menu.innerHTML = `
                <div class="dropdown-header">
                    <img src="/user/assets/images/avatar.svg" alt="Avatar" class="dropdown-avatar">
                    <div class="dropdown-info">
                        <div class="dropdown-name">${userName}</div>
                        <div class="dropdown-email">${userEmail}</div>
                    </div>
                </div>
                <div class="dropdown-divider"></div>
                <button class="dropdown-item" onclick="window.location.href='/admin/pages/dashboard.html'">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    Về trang chủ
                </button>
                <div class="dropdown-divider"></div>
                <button class="dropdown-item logout-btn" onclick="logout(); event.stopPropagation();">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
                    </svg>
                    Đăng xuất
                </button>
            `;
            
            document.body.appendChild(menu);
            
            const avatarBtn = document.querySelector('.admin-user');
            if (avatarBtn) {
                const rect = avatarBtn.getBoundingClientRect();
                menu.style.position = 'fixed';
                menu.style.top = `${rect.bottom + 10}px`;
                menu.style.right = `${window.innerWidth - rect.right}px`;
            }
            
            setTimeout(() => {
                document.addEventListener('click', function closeMenu(e) {
                    if (!menu.contains(e.target) && !avatarBtn.contains(e.target)) {
                        menu.remove();
                        document.removeEventListener('click', closeMenu);
                    }
                });
            }, 0);
        }
        
        async function logout() {
            const API_BASE_URL = 'http://127.0.0.1:8000/api';
            
            try {
                await fetch(`${API_BASE_URL}/auth/logout/`, {
                    method: 'POST',
                    credentials: 'include'
                });
                
                sessionStorage.clear();
                window.location.href = '/admin/pages/login.html';
            } catch (error) {
                console.error('Logout error:', error);
                sessionStorage.clear();
                window.location.href = '/admin/pages/login.html';
            }
        }
    </script>
</body>
</html>
