<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Admin - OLD SCHOOL</title>
    <link rel="stylesheet" href="/admin/assets/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <!-- Login Section -->
        <div class="auth-section" id="loginSection">
            <div class="auth-left">
                <div class="brand">
                    <div class="brand-logo">
                        <span class="logo-circle">OS</span>
                    </div>
                    <h1 class="brand-name">Old School</h1>
                    <p class="brand-tagline">Admin Panel</p>
                </div>
                <p class="brand-description">Trang quản trị hệ thống</p>
            </div>
            
            <div class="auth-right">
                <div class="auth-header">
                    <h2>ĐĂNG NHẬP ADMIN</h2>
                    <p class="auth-subtitle">Vui lòng đăng nhập để tiếp tục</p>
                </div>
                
                <div id="loginError" style="display: none; color: #D32F2F; background: #FFEBEE; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px;"></div>
                
                <form class="auth-form" id="loginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="username" name="username" placeholder="admin@oldschool.vn" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Mật khẩu</label>
                        <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
                    </div>
                    
                    <button type="submit" class="auth-btn">Đăng nhập</button>
                </form>
                
                <div class="auth-footer">
                    <p><a href="/login.html">← Quay về trang khách hàng</a></p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE_URL = 'http://127.0.0.1:8000/api';
    </script>
    <script src="/admin/assets/js/login.js"></script>
</body>
</html>
