<!DOCTYPE html>
<html>
<head>
    <title>Test Search</title>
</head>
<body>
    <h1>Test Order Search</h1>
    <form onsubmit="doSearch(event)">
        <input type="text" id="searchBox" placeholder="Nhập mã đơn hàng">
        <button type="submit">Tìm kiếm</button>
    </form>
    
    <div id="result"></div>
    
    <script>
        function doSearch(e) {
            e.preventDefault();
            const query = document.getElementById('searchBox').value;
            alert('Searching for: ' + query);
            window.location.href = '/orders.html?search=' + encodeURIComponent(query);
        }
    </script>
</body>
</html>
