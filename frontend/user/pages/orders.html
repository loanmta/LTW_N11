
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn hàng của tôi - OLD SCHOOL</title>
    <link rel="stylesheet" href="/user/assets/css/global.css?v=10">
    <link rel="stylesheet" href="/user/assets/css/header.css?v=10">
    <link rel="stylesheet" href="/user/assets/css/orders.css?v=10">
    <link rel="stylesheet" href="/user/assets/css/footer.css?v=10">
</head>
<body>
    <!-- Header -->
    <div id="header-container"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1 class="page-title">Đơn hàng của tôi</h1>
            </div>

            <!-- Filter Tabs -->
            <div class="filter-tabs">
                <a href="?status=all" class="filter-tab active" data-status="all">Tất cả</a>
                <a href="?status=pending" class="filter-tab" data-status="pending">Chờ xác nhận</a>
                <a href="?status=confirmed" class="filter-tab" data-status="confirmed">Đã xác nhận</a>
                <a href="?status=shipping" class="filter-tab" data-status="shipping">Đang giao</a>
                <a href="?status=completed" class="filter-tab" data-status="completed">Hoàn thành</a>
                <a href="?status=cancelled" class="filter-tab" data-status="cancelled">Đã hủy</a>
            </div>

            <!-- Search Box -->
            <div class="search-section">
                <form class="search-form">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M13 13l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <input type="text" name="search" class="search-input" placeholder="Tìm kiếm theo Mã đơn hàng">
                </form>
            </div>

            <!-- Orders List -->
            <div class="orders-list">
                <div class="loading-state">Đang tải đơn hàng...</div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <script src="/user/assets/js/api.js"></script>
    <script src="/user/assets/js/auth-check.js"></script>
    <script src="/user/assets/js/components.js"></script>
    <script src="/user/assets/js/orders.js"></script>
    <script>
        // Check authentication on page load
        requireAuth();
    </script>
</body>
</html>
